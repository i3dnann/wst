[build]
  command = "pnpm --filter @mafia/web build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[[redirects]]
  from = "https://wstgang.netlify.app/*"
  to = "https://wstgang.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/backend/*"
  to = "/.netlify/functions/backend/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.cloudinary.com; frame-src https://player.kick.com https://player.twitch.tv https://www.youtube.com https://www.youtube-nocookie.com; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
